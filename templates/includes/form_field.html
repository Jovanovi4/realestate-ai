<label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="app-required" aria-hidden="true">*</span>{% endif %}</label>
{{ field }}
{% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
{% if field.errors %}<div class="app-field-error text-danger" role="alert">{{ field.errors|striptags }}</div>{% endif %}
