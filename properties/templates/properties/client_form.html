{% extends "base.html" %}
{% block title %}Новый клиент{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="card-body p-4 p-lg-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="small text-muted mb-1">CRM</p><h1 class="h2 mb-0">Новый клиент</h1></div><a href="{% url 'client_list' %}" class="btn btn-outline-secondary">Отмена</a></div><form method="post">{% csrf_token %}<div class="row">{% for field in form %}<div class="{% if field.name == 'notes' or field.name == 'outcome_reason' %}col-12{% else %}col-md-6{% endif %} mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}</div>{% endfor %}</div><button class="btn btn-primary">Сохранить клиента</button></form></div></div></div></div>{% endblock %}
