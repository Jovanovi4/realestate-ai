{% extends "base.html" %}
{% block title %}Объекты недвижимости{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><p class="small text-muted mb-1">Рабочее пространство</p><h1 class="h2 mb-0">Объекты</h1></div><div class="d-flex gap-2"><a href="{% url 'avito_export' %}" class="btn btn-outline-secondary">XML для Avito</a><a href="{% url 'create_property' %}" class="btn btn-primary">Создать объект</a></div></div>

<div class="card border-0 shadow-sm mb-4"><div class="card-body p-3 p-lg-4"><form id="property-filters" method="get" class="row g-3 align-items-end" hx-get="{% url 'property_list' %}" hx-target="#property-results" hx-push-url="true" hx-trigger="input changed delay:350ms, change, submit">
  <div class="col-lg-4"><label class="form-label" for="q">Поиск</label><input id="q" class="form-control" name="q" value="{{ filters.q }}" placeholder="Название или адрес"></div>
  <div class="col-sm-6 col-lg-2"><label class="form-label" for="property_type">Тип</label><select id="property_type" class="form-select" name="property_type"><option value="">Все типы</option>{% for value, label in property_types %}<option value="{{ value }}" {% if filters.property_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="col-sm-6 col-lg-2"><label class="form-label" for="status">Статус</label><select id="status" class="form-select" name="status"><option value="">Все статусы</option>{% for value, label in status_choices %}<option value="{{ value }}" {% if filters.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="col-sm-6 col-lg-2"><label class="form-label" for="min_price">Цена от</label><input id="min_price" class="form-control" type="number" name="min_price" value="{{ filters.min_price }}"></div>
  <div class="col-sm-6 col-lg-2"><label class="form-label" for="max_price">Цена до</label><input id="max_price" class="form-control" type="number" name="max_price" value="{{ filters.max_price }}"></div>
  <div class="col-sm-8 col-lg-3"><label class="form-label" for="sort">Сортировка</label><select id="sort" class="form-select" name="sort">{% for value, label in sort_choices %}<option value="{{ value }}" {% if filters.sort == value or not filters.sort and value == 'newest' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="col-12"><span class="htmx-indicator small text-muted">Обновляем список…</span></div>
</form></div></div>

<div id="property-results">{% include "properties/includes/property_cards.html" %}</div>
{% endblock %}
