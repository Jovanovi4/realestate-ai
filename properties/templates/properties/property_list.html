{% extends "base.html" %}
{% block title %}Объекты недвижимости{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><p class="small text-muted mb-1">Рабочее пространство</p><h1 class="h2 mb-0">Объекты</h1></div><div class="d-flex gap-2"><div class="dropdown action-menu"><button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Экспорт XML</button><ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="{% url 'avito_export' %}">Avito</a></li><li><a class="dropdown-item" href="{% url 'cian_export' %}">ЦИАН</a></li></ul></div><a href="{% url 'create_property' %}" class="btn btn-primary">Создать объект</a></div></div>

<div class="card border-0 shadow-sm mb-4"><div class="card-body p-3 p-lg-4"><form id="property-filters" method="get" hx-get="{% url 'property_list' %}" hx-target="#property-results" hx-push-url="true" hx-trigger="input changed delay:350ms, change, submit">
  <button class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" type="button" data-bs-toggle="collapse" data-bs-target="#property-filter-panel" aria-expanded="{% if filters.q or filters.property_type or filters.deal_type or filters.status or filters.min_price or filters.max_price or filters.sort %}true{% else %}false{% endif %}" aria-controls="property-filter-panel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M7 12h10m-7 6h4"/></svg>Фильтры и сортировка{% if filters.q or filters.property_type or filters.deal_type or filters.status or filters.min_price or filters.max_price or filters.sort %}<span class="badge text-bg-secondary">Настроены</span>{% endif %}</button>
  <div class="collapse{% if filters.q or filters.property_type or filters.deal_type or filters.status or filters.min_price or filters.max_price or filters.sort %} show{% endif %}" id="property-filter-panel"><div class="border-top mt-3 pt-3"><div class="row g-3 align-items-end">
    <div class="col-lg-4"><label class="form-label" for="q">Поиск</label><input id="q" class="form-control" name="q" value="{{ filters.q }}" placeholder="Название или адрес"></div>
    <div class="col-sm-6 col-lg-2"><label class="form-label" for="property_type">Тип</label><select id="property_type" class="form-select" name="property_type"><option value="">Все типы</option>{% for value, label in property_types %}<option value="{{ value }}" {% if filters.property_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
    <div class="col-sm-6 col-lg-2"><label class="form-label" for="deal_type">Сделка</label><select id="deal_type" class="form-select" name="deal_type"><option value="">Все сделки</option>{% for value, label in deal_types %}<option value="{{ value }}" {% if filters.deal_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
    <div class="col-sm-6 col-lg-2"><label class="form-label" for="status">Статус</label><select id="status" class="form-select" name="status"><option value="">Все статусы</option>{% for value, label in status_choices %}<option value="{{ value }}" {% if filters.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
    <div class="col-sm-6 col-lg-2"><label class="form-label" for="min_price">Цена от</label><input id="min_price" class="form-control" type="number" name="min_price" value="{{ filters.min_price }}"></div>
    <div class="col-sm-6 col-lg-2"><label class="form-label" for="max_price">Цена до</label><input id="max_price" class="form-control" type="number" name="max_price" value="{{ filters.max_price }}"></div>
    <div class="col-sm-8 col-lg-3"><label class="form-label" for="sort">Сортировка</label><select id="sort" class="form-select" name="sort">{% for value, label in sort_choices %}<option value="{{ value }}" {% if filters.sort == value or not filters.sort and value == 'newest' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
    <div class="col-12"><span class="htmx-indicator small text-muted">Обновляем список…</span></div>
  </div></div></div>
</form></div></div>

<div id="property-results">{% include "properties/includes/property_cards.html" %}</div>
{% endblock %}
