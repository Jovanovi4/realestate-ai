{% extends "base.html" %}

{% block title %}
Фотографии
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="mb-4">

                    Загрузка фотографий

                </h2>

                <form
                    method="post"
                    enctype="multipart/form-data">

                    {% csrf_token %}

                    <input
                        type="file"
                        name="images"
                        multiple
                        accept="image/*"
                        class="form-control mb-4">

                    <button
                        class="btn btn-success">

                        Загрузить фотографии

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
