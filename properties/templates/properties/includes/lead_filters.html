<div class="lead-filter-bar mb-4">
  <span class="small fw-semibold text-muted me-2">Показать</span>
  <a class="lead-filter-option {% if not selected_status %}is-active{% endif %}" href="{% url 'lead_list' %}" hx-get="{% url 'lead_list' %}" hx-target="#lead-workspace" hx-swap="outerHTML">Все</a>
  {% for value, label in status_choices %}<a class="lead-filter-option {% if value == selected_status %}is-active{% endif %}" href="?status={{ value }}" hx-get="{% url 'lead_list' %}?status={{ value }}" hx-target="#lead-workspace" hx-swap="outerHTML">{{ label }}</a>{% endfor %}
  <span class="htmx-indicator small text-muted ms-2">Обновляем…</span>
</div>
