<div class="modal fade" id="leadModal" tabindex="-1" aria-labelledby="leadModalTitle" aria-hidden="true" {% if form.errors %}data-open-on-load="true"{% endif %}>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-body p-4 p-md-5">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
          <div><p class="eyebrow mb-2">Связаться</p><h2 id="leadModalTitle" class="h3 mb-1">{{ property.landing_contact_title|default:"Запланировать просмотр" }}</h2><p class="text-muted mb-0">Оставьте контакты — риелтор ответит в ближайшее время.</p></div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <form method="post">{% csrf_token %}
          {% for field in form %}
            <div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|striptags }}</div>{% endif %}</div>
          {% endfor %}
          <button class="btn btn-primary w-100">Отправить заявку</button>
        </form>
      </div>
    </div>
  </div>
</div>
