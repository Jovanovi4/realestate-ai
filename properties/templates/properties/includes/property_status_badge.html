<span id="property-status" class="badge text-bg-{% if property.status == 'published' or property.status == 'available' %}success{% elif property.status == 'showing' %}info{% elif property.status == 'sold' or property.status == 'rented' %}secondary{% elif property.status == 'reserved' %}warning{% else %}light{% endif %}">{{ property.get_status_display }}</span>{% if billing_error %}<span class="small text-danger ms-2" role="alert">{{ billing_error }} <a href="{% url 'billing:overview' %}">Тариф и расход</a></span>{% endif %}
