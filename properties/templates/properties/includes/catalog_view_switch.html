<div class="catalog-view-toolbar">
  <div class="catalog-view-switch" role="group" aria-label="Вид отображения {{ catalog_label }}">
    <button class="catalog-view-switch__button is-active" type="button" data-catalog-option="cards" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-icon-view-cards"></use></svg><span>Карточки</span></button>
    <button class="catalog-view-switch__button" type="button" data-catalog-option="compact" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-icon-view-compact"></use></svg><span>Компактно</span></button>
    <button class="catalog-view-switch__button" type="button" data-catalog-option="list" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-icon-view-list"></use></svg><span>Список</span></button>
  </div>
</div>
