<div class="catalog-view-toolbar">
  <div class="catalog-view-switch ui-switch" role="group" aria-label="Вид отображения {{ catalog_label }}">
    <button class="catalog-view-switch__button ui-switch__option is-active" type="button" data-catalog-option="cards" aria-pressed="true" aria-label="Карточки" data-tooltip="Карточки"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-icon-view-cards"></use></svg></button>
    <button class="catalog-view-switch__button ui-switch__option" type="button" data-catalog-option="compact" aria-pressed="false" aria-label="Компактно" data-tooltip="Компактно"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-icon-view-compact"></use></svg></button>
    <button class="catalog-view-switch__button ui-switch__option" type="button" data-catalog-option="list" aria-pressed="false" aria-label="Список" data-tooltip="Список"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-icon-view-list"></use></svg></button>
  </div>
</div>
