<div id="lead-ai-reply" class="card shadow-sm border-0 mb-4" x-data="{ tone: '{% if ai_content %}{{ ai_content.tone }}{% else %}business{% endif %}', copied: false, async copyReply() { const text = this.$refs.reply.value; if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); } else { this.$refs.reply.select(); document.execCommand('copy'); } this.copied = true; setTimeout(() => this.copied = false, 1800); } }">
  <div class="card-body p-4"><h2 class="h5 mb-1">Ответ клиенту</h2><p class="small text-muted mb-3">ИИ подготовит короткое сообщение на основе заявки и объекта.</p>
    <form method="post" action="{% url 'lead_ai_reply' lead.pk %}" hx-post="{% url 'lead_ai_reply' lead.pk %}" hx-target="#lead-ai-reply" hx-swap="outerHTML" hx-indicator="#lead-ai-reply-indicator" hx-disabled-elt="find button">
      {% csrf_token %}<input type="hidden" name="tone" x-model="tone">
      <div class="d-flex flex-wrap gap-2 mb-3"><button type="button" class="ai-tone" :class="{ 'is-active': tone === 'business' }" @click="tone = 'business'">Деловой</button><button type="button" class="ai-tone" :class="{ 'is-active': tone === 'premium' }" @click="tone = 'premium'">Премиальный</button><button type="button" class="ai-tone" :class="{ 'is-active': tone === 'concise' }" @click="tone = 'concise'">Коротко</button></div>
      <button class="btn btn-outline-primary w-100">Подготовить ответ</button><div id="lead-ai-reply-indicator" class="htmx-indicator text-center text-primary small mt-2"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>ИИ готовит ответ…</div>
    </form>
    {% if error %}<div class="alert alert-danger small mt-3 mb-0">{{ error }}</div>{% endif %}
    {% if ai_content %}<div class="border-top mt-4 pt-3"><textarea class="form-control small" rows="5" readonly x-ref="reply">{{ ai_content.edited_content|default:ai_content.content }}</textarea><button type="button" class="btn btn-icon btn-sm btn-outline-secondary mt-2" @click="copyReply()" :title="copied ? 'Скопировано' : 'Скопировать ответ'" :aria-label="copied ? 'Скопировано' : 'Скопировать ответ'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="5" width="8" height="8" rx="1"/><path d="M11 5V3.75A1.75 1.75 0 0 0 9.25 2H3.75A1.75 1.75 0 0 0 2 3.75v5.5A1.75 1.75 0 0 0 3.75 11H5"/></svg></button></div>{% endif %}
  </div>
</div>
