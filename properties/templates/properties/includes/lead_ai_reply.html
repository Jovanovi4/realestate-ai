<section id="lead-ai-reply" class="detail-section detail-section--spaced" x-data="{ tone: '{% if ai_content %}{{ ai_content.tone }}{% else %}business{% endif %}', copied: false, async copyReply() { const text = this.$refs.reply.value; if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); } else { this.$refs.reply.select(); document.execCommand('copy'); } this.copied = true; setTimeout(() => this.copied = false, 1800); } }">
  <div class="detail-section__heading"><div><span class="detail-kicker">Помощник</span><h2>Ответ клиенту</h2><p>ИИ подготовит короткое сообщение на основе заявки и объекта.</p></div></div>
  <form method="post" action="{% url 'lead_ai_reply' lead.pk %}" hx-post="{% url 'lead_ai_reply' lead.pk %}" hx-target="#lead-ai-reply" hx-swap="outerHTML" hx-indicator="#lead-ai-reply-indicator" hx-disabled-elt="find button">
    {% csrf_token %}<input type="hidden" name="tone" x-model="tone">
    <div class="detail-tone-options" role="group" aria-label="Стиль ответа"><button type="button" class="ai-tone" :class="{ 'is-active': tone === 'business' }" @click="tone = 'business'">Деловой</button><button type="button" class="ai-tone" :class="{ 'is-active': tone === 'premium' }" @click="tone = 'premium'">Премиальный</button><button type="button" class="ai-tone" :class="{ 'is-active': tone === 'concise' }" @click="tone = 'concise'">Коротко</button></div>
    <button class="btn btn-neutral" type="submit">Подготовить ответ</button><div id="lead-ai-reply-indicator" class="htmx-indicator detail-ai-loading" role="status"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>ИИ готовит ответ…</div>
  </form>
  {% if error %}<div class="alert alert-danger small mt-3 mb-0">{{ error }}</div>{% endif %}
  {% if ai_content %}<div class="detail-ai-result"><label class="form-label" for="lead-ai-reply-text">Готовый ответ</label><textarea id="lead-ai-reply-text" class="form-control" rows="5" readonly x-ref="reply">{{ ai_content.edited_content|default:ai_content.content }}</textarea><button type="button" class="btn btn-icon btn-sm btn-neutral mt-2" @click="copyReply()" :title="copied ? 'Скопировано' : 'Скопировать ответ'" :aria-label="copied ? 'Скопировано' : 'Скопировать ответ'"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-icon-copy"></use></svg></button></div>{% endif %}
</section>
