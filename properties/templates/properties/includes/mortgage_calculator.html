{% if landing_enabled.mortgage %}<section class="section mortgage-section" style="order: {{ landing_order.mortgage }}" data-mortgage-calculator>
  <div class="container"><div class="row justify-content-center"><div class="col-lg-10"><div class="card border-0 shadow-sm mortgage-card"><div class="card-body p-4 p-md-5">
    <div class="row g-4 align-items-end"><div class="col-lg-5"><p class="text-uppercase small fw-semibold text-primary mb-2">Ипотечный калькулятор</p><h2 class="h2 mb-3">Рассчитайте платёж</h2><p class="text-muted mb-0">Укажите условия, чтобы увидеть ориентировочный ежемесячный платёж.</p></div>
      <div class="col-sm-6 col-lg-4"><label class="form-label">Стоимость объекта, ₽</label><input class="form-control" data-price type="number" min="0" step="1000" value="{% if property.currency == 'RUB' %}{{ property.price|default:0 }}{% else %}0{% endif %}"></div>
      <div class="col-sm-6 col-lg-3"><label class="form-label">Первый взнос, %</label><input class="form-control" data-down-payment type="number" min="0" max="99" step="1" value="20"></div>
      <div class="col-sm-6"><label class="form-label">Ставка, % годовых</label><input class="form-control" data-rate type="number" min="0" max="100" step="0.1" value="18"></div>
      <div class="col-sm-6"><label class="form-label">Срок, лет</label><input class="form-control" data-years type="number" min="1" max="50" step="1" value="20"></div>
      <div class="col-lg-4"><div class="rounded-3 p-3 bg-light"><span class="small text-muted d-block">Ежемесячный платёж</span><strong class="fs-3" data-payment>—</strong></div></div>
    </div>
    <p class="small text-muted mt-4 mb-0">Расчёт носит справочный характер и не является предложением банка.</p>
  </div></div></div></div></div>
</section>
{% endif %}
<script>
  document.querySelectorAll('[data-mortgage-calculator]').forEach((calculator) => {
    const fields = {
      price: calculator.querySelector('[data-price]'),
      downPayment: calculator.querySelector('[data-down-payment]'),
      rate: calculator.querySelector('[data-rate]'),
      years: calculator.querySelector('[data-years]'),
      payment: calculator.querySelector('[data-payment]'),
    };
    const calculatePayment = () => {
      const price = Number(fields.price.value) || 0;
      const downPayment = Math.min(Math.max(Number(fields.downPayment.value) || 0, 0), 99);
      const rate = Math.max(Number(fields.rate.value) || 0, 0) / 100 / 12;
      const months = Math.max(Number(fields.years.value) || 0, 0) * 12;
      const loan = price * (1 - downPayment / 100);
      const payment = !loan || !months ? 0 : rate ? loan * rate * (1 + rate) ** months / ((1 + rate) ** months - 1) : loan / months;
      fields.payment.textContent = payment ? `${Math.round(payment).toLocaleString('ru-RU')} ₽` : '—';
    };
    Object.values(fields).slice(0, 4).forEach((field) => field.addEventListener('input', calculatePayment));
    calculatePayment();
  });
</script>
