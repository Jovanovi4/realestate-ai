{% for item in work_overview %}<a class="agency-work-stat{% if item.urgent and item.count %} agency-work-stat--urgent{% endif %}" href="{{ item.url }}" aria-label="{{ item.label }}: {{ item.count }} {{ item.detail }}. Открыть список"><span class="agency-work-stat__label">{{ item.label }}</span><strong>{{ item.count }}</strong><span class="agency-work-stat__foot">{{ item.detail }} <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-icon-chevron-right"></use></svg></span></a>{% endfor %}
