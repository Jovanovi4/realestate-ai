{% extends "registration/account_security.html" %}
{% block security_content %}
  {% if validlink %}{{ block.super }}{% else %}
    <div class="app-form-error-summary" role="alert">Ссылка истекла или уже использована. Запросите новую ссылку восстановления.</div>
    <a class="btn btn-neutral w-100" href="{% url 'password_reset' %}">Восстановить доступ</a>
  {% endif %}
{% endblock %}
